<script>
let _lbImgs=[], _lbIdx=0;
function openLightbox(img) { _lbImgs=Array.from(document.querySelectorAll('.gallery-masonry img')); _lbIdx=_lbImgs.indexOf(img); document.getElementById('lightbox-img').src=img.src; document.getElementById('lightbox').classList.add('open'); }
function navigateLightbox(dir) { _lbIdx=(_lbIdx+dir+_lbImgs.length)%_lbImgs.length; document.getElementById('lightbox-img').src=_lbImgs[_lbIdx].src; }
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
document.addEventListener('keydown', e => { if(e.key==='Escape') closeLightbox(); if(e.key==='ArrowRight') navigateLightbox(1); if(e.key==='ArrowLeft') navigateLightbox(-1); });
</script>
