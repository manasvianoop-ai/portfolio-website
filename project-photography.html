  <div class="proj-meta">
    <span class="proj-tag">2025</span>
  </div>
  <p class="proj-desc">A series of design photographs exploring texture, composition, and the quiet beauty found in everyday materials and spaces.</p>
</header>

<section class="proj-gallery">
  <div class="gallery-masonry">
    <figure>
      <img src="images/4c2dca81-89b8-4add-a2e8-eaf4f6f15297.jpg" alt="On the Prowl" onclick="openLightbox(this)" />
      <figcaption><strong>On the Prowl</strong><span>Captures a detailed leopard design engraved into lightweight concrete by Dekko, symbolizing power and beauty combined with nature and modern design. The wall uses lightweight concrete, clay, shale, and slate, and it is completely resin-free.</span></figcaption>
    </figure>
    <figure>
      <img src="images/4f1fe175-b307-4b2f-bf42-bed8db86270d.jpg" alt="The Unfiltered Trio" onclick="openLightbox(this)" />
      <figcaption><strong>The Unfiltered Trio</strong><span>A bronze sculpture photographed in Montreal; the three figures appear frozen in time yet lively and full of personality, shot using the Rule of Odds composition technique.</span></figcaption>
    </figure>
    <figure>
      <img src="images/c6528ac0-fe9d-4d6c-8af8-7f9e59e88775.png" alt="Stone Whispers" onclick="openLightbox(this)" />
      <figcaption><strong>Stone Whispers</strong><span>Explores beauty in calm, quiet details through symmetrical stone patterns captured from bird's eye view.</span></figcaption>
    </figure>
    <figure>
      <img src="images/f5befb3b-caf4-4d1a-afdc-4c07c533ff9d.jpg" alt="The Zen Mode" onclick="openLightbox(this)" />
      <figcaption><strong>The Zen Mode</strong><span>Time to Reflect.</span></figcaption>
    </figure>
    <figure>
      <img src="images/c15cbd96-9c7e-49d1-9f82-7924e1ab50c0.jpg" alt="The Woven Radiance" onclick="openLightbox(this)" />
      <figcaption><strong>The Woven Radiance</strong><span>Uses worm's eye view beneath a lamp, creating a dramatic perspective that emphasizes the intricate radial pattern.</span></figcaption>
    </figure>
    <figure>
      <img src="images/094538d4-a571-4d49-8463-456da2df9bcd.jpg" alt="Texture Meets Tranquility" onclick="openLightbox(this)" />
      <figcaption><strong>Texture Meets Tranquility</strong><span>Finding serenity in the quiet poetry of surface and material.</span></figcaption>
    </figure>
    <figure>
      <img src="images/f3a76be4-08f8-4c16-b77f-2c2ca2320c0d.jpg" alt="The Infinity Gate" onclick="openLightbox(this)" />
      <figcaption><strong>The Infinity Gate</strong><span>A perfect example of the frame within a frame compositional technique.</span></figcaption>
    </figure>
  </div>
</section>

<script>
let _lbImgs=[], _lbIdx=0;
function openLightbox(img) { _lbImgs=Array.from(document.querySelectorAll('.gallery-masonry img')); _lbIdx=_lbImgs.indexOf(img); document.getElementById('lightbox-img').src=img.src; document.getElementById('lightbox').classList.add('open'); }
function navigateLightbox(dir) { _lbIdx=(_lbIdx+dir+_lbImgs.length)%_lbImgs.length; document.getElementById('lightbox-img').src=_lbImgs[_lbIdx].src; }
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
document.addEventListener('keydown', e => { if(e.key==='Escape') closeLightbox(); if(e.key==='ArrowRight') navigateLightbox(1); if(e.key==='ArrowLeft') navigateLightbox(-1); });
</script>
